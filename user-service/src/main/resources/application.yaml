server:
  port: 5001

spring:
  application:
    name: USER_SERVICE
  datasource:
    url: jdbc:postgresql://localhost:5432/defect-tracker-db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect


